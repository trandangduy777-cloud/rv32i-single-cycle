# Kiem chung tu dong moi lan push: testbench tu kiem tra, so vet voi ISS tren chuong trinh ngau nhien, ngat,
# so tung lenh voi Spike (job cosim), chung minh hinh thuc bo nhan (job formal),
# bo test ISA chinh thuc riscv-tests va benchmark (so checksum giua cac loi).
# Mutation test chay lau (10-20 phut) nen chi chay khi bam "Run workflow" trong tab Actions.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'   # mutation day du hang tuan (02:17 thu Hai gio Viet Nam)

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tools/check_commits.py can lich su main

      # Chot chan quy trinh (vai giay), chay truoc moi mo phong. Xem README muc "Quy trinh commit".
      - name: Chuoi goc cua moi dot bien xuat hien dung 1 lan (tools/check_mutants.py)
        run: python3 tools/check_mutants.py -v

      - name: Author cua commit la chu repo
        env:
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then R="origin/main..$PR_HEAD"
          elif [ "${{ github.ref }}" = refs/heads/main ]; then R="$BEFORE..${{ github.sha }}"
          else R="origin/main..${{ github.sha }}"; fi
          python3 tools/check_commits.py --author --range "$R"

      - name: Nhip commit tren main (1 cha, <= 12 commit / ngay gio VN, canh bao commit chẻ vụn)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then python3 tools/check_commits.py --pr
          else python3 tools/check_commits.py --range "$BEFORE..${{ github.sha }}"; fi

      - name: Cai iverilog va trinh bien dich RISC-V
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc-riscv64-unknown-elf

      - name: Testbench tu kiem tra (3 loi)
        run: |
          iverilog -g2012 -DNO_VCD -o sc tb_rv32i_core.v rv32i_core.v
          vvp sc | tee sc.log && grep -q "\[TB\] PASS" sc.log
          iverilog -g2012 -DPIPE -DNO_VCD -o p tb_rv32i_pipeline.v rv32i_pipeline.v
          vvp p +prog=prog_base.hex | tee p.log && grep -q "\[TB\] PASS" p.log
          iverilog -g2012 -DPIPE_FULL -DNO_VCD -o pm tb_rv32i_pipeline.v rv32im_pipeline.v rv32i_core.v
          vvp pm +prog=prog.hex | tee pm.log && grep -q "\[TB\] PASS" pm.log

      - name: So vet tung lenh voi ISS (chuong trinh ngau nhien)
        working-directory: verify
        run: |
          python3 run_verify.py --n 60
          python3 run_verify.py --pipe --n 60
          python3 run_verify.py --pipem --n 60
          python3 run_verify.py --pipem --cache --n 60
          python3 run_verify.py --pipem --cache --ways 2 --n 60
          python3 run_verify.py --pipem --ma --n 60
          python3 run_verify.py --pipem --ma --cache --n 60
          python3 run_verify.py --pipem --bpstress --n 60
          python3 run_verify.py --pipem --bpstress --cache --n 60
          python3 run_verify.py --pipem --mul-lat 0 --n 60
          python3 run_verify.py --pipem --mul-lat 1 --n 60
          python3 run_verify.py --pipem --mul-lat 1 --cache --n 60
          python3 run_verify.py --pipem --zb all --zb-probe --n 60
          python3 run_verify.py --pipem --zb zba,zbs --zb-probe --cache --n 60
          python3 run_verify.py --pipem --zb zbb,zbc,zicond --zb-probe --bpstress --mul-lat 0 --n 60

      - name: Bo nhan song song (Booth + cay CSA), thu het moi cap o 3-10 bit, gia tri bien + ngau nhien o 33 bit
        run: |
          for w in 3 4 5 8 9 10 33; do
            iverilog -g2012 -DW=$w -o mul.vvp mul/tb_mul.v rv32i_core.v
            vvp -n mul.vvp +n=20000 | tee mul.log && grep -q "\[MUL\] PASS" mul.log
          done

      - name: Ngat timer va ngat ngoai (pipeline RV32IM) va mutation test phan ngat
        run: |
          iverilog -g2012 -o irq.vvp irq/tb_irq.v rv32im_pipeline.v rv32i_core.v rv32_mtimer.v
          vvp irq.vvp | tee irq.log && grep -q "\[IRQ\] PASS" irq.log
          python3 irq/mutate_irq.py

      - name: Bo giai nen lenh C, so ca 49.152 ma lenh 16 bit voi GNU objdump
        run: python3 rvc/check_decompress.py

      - name: Cache lenh/du lieu (1, 2, 4 duong), bo dem ghi va bo phan xu bus, kiem tra ngau nhien (9 cau hinh x 3 seed)
        run: |
          for cfg in "-DL=4 -DW=2" "-DL=16 -DW=4" "-DL=2 -DW=8" "-DL=4 -DW=2 -DQ=1" "-DL=16 -DW=4 -DQ=3" \
                     "-DL=8 -DW=2 -DWY=2" "-DL=16 -DW=4 -DWY=2" "-DL=4 -DW=2 -DWY=4" "-DL=16 -DW=4 -DWY=4 -DQ=1"; do
            iverilog -g2012 $cfg -o cr.vvp cache/tb_cache_random.v rv32_icache.v rv32_dcache.v rv32_bus_arbiter.v
            for seed in 1 2 3; do
              vvp -n cr.vvp +seed=$seed +n=20000 +lat=6 | tee c.log
              grep -q "\[CACHE\] PASS" c.log
            done
          done

      - name: riscv-tests (rv32ui, rv32um, rv32uzba/zbb/zbc/zbs)
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-tests.git /tmp/riscv-tests
          python3 riscv-tests/run_riscv_tests.py /tmp/riscv-tests

      - name: SoC (bus, UART, GPIO, timer, chuong trinh C qua UART, so bit UART)
        run: |
          sh soc/sw/build.sh
          sh soc/freertos/build.sh
          python3 soc/run_soc.py

      - name: SoC AXI4 + DMA (interconnect ngau nhien 3 master, bo kiem giao thuc AXI4, chuong trinh C, DMA, FreeRTOS)
        run: |
          AXI=1 sh soc/sw/build.sh
          AXI=1 sh soc/freertos/build.sh
          python3 soc/run_soc.py --axi

      - name: SoC cau hinh Linux (S / U + MMU Sv32, CLINT chuan, PLIC context S; M -> S -> U, page fault, STIP / SSIP / SEIP; thuong va AXI4)
        run: |
          SU=1 sh soc/sw/build.sh
          SU=1 sh soc/freertos/build.sh
          python3 soc/run_soc.py --su
          AXI=1 SU=1 sh soc/sw/build.sh
          AXI=1 SU=1 sh soc/freertos/build.sh
          python3 soc/run_soc.py --axi --su

      - name: Benchmark (CPI, so checksum giua cac loi)
        run: sh bench/run_bench.sh

  verilator:
    # Verilator: lint -Wall (13 muc tieu, mien tru co giai thich), SVA bind (bo phan xu, cache, pipeline) tren RTL sach,
    # cocotb (cache du lieu + he thong bo nho: scoreboard + functional coverage). Dot bien SVA / cocotb chay khi bam Run workflow va hang tuan.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Cai Verilator, cocotb, cocotb-coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make iverilog gcc-riscv64-unknown-elf
          pip install cocotb==1.9.2 cocotb-coverage
          verilator --version
      - name: Lint -Wall (phai sach, khong mien tru thua)
        run: python3 verilator/lint.py
      - name: SVA bind tren RTL sach (cache, bo phan xu, pipeline chay chuong trinh ngau nhien va ngat)
        run: python3 verilator/run_sva.py --n 3
      - name: cocotb (scoreboard + functional coverage)
        run: python3 verilator/run_cocotb.py --seeds 3 --nops 2000
      - name: Luu bao cao functional coverage cocotb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-coverage
          path: results/cocotb
      - name: Dot bien SVA va cocotb (khi bam Run workflow va hang tuan)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          python3 verilator/mutate_sva.py --jobs 2
          python3 verilator/mutate_cocotb.py

  formal:
    # Chung minh hinh thuc bo nhan song song 33 bit (tach bo de, yosys + z3) kem doi chung am.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cai yosys (YoWASP) va z3
        run: pip install yowasp-yosys==0.71.0.0.post1285 z3-solver==5.4.1.0
      - name: Chung minh bo nhan (L1-L4, dai so, doi chung am)
        run: python3 mul/formal/run_formal.py

  formal-rvfi:
    # riscv-formal (RVFI) cho pipeline RV32IMC: moi check insn_*, reg, pc_fwd/pc_bwd, causal, unique, liveness, hang, CSR, cover
    # bang SymbiYosys + Boolector (BMC), roi dot bien co y: moi dot bien PHAI lam check tuong ung FAIL. Xem formal/README.md muc riscv-formal.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache Boolector, SymbiYosys
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local
            ~/.cache/YoWASP
          key: formal-tools-v2-${{ hashFiles('formal/setup_ci.sh') }}
      - name: Cai yosys (YoWASP), SymbiYosys, Boolector
        run: |
          sh formal/setup_ci.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cac check riscv-formal (tat ca)
        run: JOBS=$(nproc) bash formal/run.sh run '.'
      - name: Dot bien co y (moi loi phai bi bat)
        run: bash formal/mutate.sh
      - name: Chung minh bo chia (k-induction tren RTL + dai so z3, 3 cau hinh, 7 dot bien)
        run: |
          pip install -q --break-system-packages z3-solver || pip install -q z3-solver
          bash formal/div/run.sh
      - name: Liveness co WFI (mo hinh ngat cong bang)
        run: CFG=formal/checks_wfi.cfg WORK=/tmp/formal-wfi bash formal/run.sh run '^liveness_ch0$'
      - name: "MISALIGNED = 1 (load/store lech chay bang phan cung) - 8 check insn + monitor muc bus"
        run: CFG=formal/checks_misal.cfg WORK=/tmp/formal-misal JOBS=$(nproc) bash formal/run.sh run '^insn_(lb|lbu|lh|lhu|lw|sb|sh|sw)_ch0$' '^mon_misal_ch0$'
      - name: Cache lenh / du lieu (k-quy nap tren RTL, 5 + 5 cau hinh, 18 dot bien)
        run: bash formal/cache/run.sh
      - name: Ghep nhan/chia vao pipeline (done that == done ALTOPS, khong phu thuoc toan hang, 2 dot bien)
        run: bash formal/stitch/run.sh
      - name: Luu log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv-formal-logs
          path: |
            /tmp/formal-work/results.txt
            /tmp/formal-work/riscv-formal/cores/rv32im_pipeline/checks/*.log
            /tmp/formal-misal/results.txt

  cosim:
    # So tung lenh voi Spike. Spike duoc build tu ma nguon (ghim phien ban) va luu cache giua cac lan chay.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SPIKE_SHA: 7d1ee24bcc3308557e1c6a45c579db9ca5e97dd9
    steps:
      - uses: actions/checkout@v4

      - name: Cai iverilog, trinh bien dich RISC-V va dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc-riscv64-unknown-elf device-tree-compiler verilator

      - name: Cache Spike
        id: cache-spike
        uses: actions/cache@v4
        with:
          path: ~/spike
          key: spike-${{ env.SPIKE_SHA }}-ubuntu-24.04

      - name: Build Spike
        if: steps.cache-spike.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/spike-src
          cd /tmp/spike-src
          git checkout $SPIKE_SHA
          git submodule update --init --depth 1
          mkdir build && cd build
          ../configure --prefix=$HOME/spike
          make -j$(nproc)
          make install

      - name: Hieu nang bo du doan nhanh, kiem dung tung chu ky
        run: python3 bpred/perf_bpred.py --check

      - name: TAGE so tung du doan voi mo hinh tham chieu (vet Spike + vet tong hop, 2 cau hinh)
        run: python3 tage/check_tage.py --quick --spike $HOME/spike/bin/spike

      - name: CoreMark 1 vong tren pipeline RV32IM / RV32IMC (kiem CRC chuan, in CoreMark/MHz)
        run: python3 coremark/run_coremark.py --iter 1 --quick

      - name: So vet voi Spike (riscv-tests, bench, bench_m, bench_call, CoreMark, test tu viet; 17 cau hinh loi)
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-tests.git /tmp/riscv-tests
          python3 cosim/run_cosim.py /tmp/riscv-tests --spike $HOME/spike/bin/spike

      - name: So vet chuong trinh ngau nhien voi Spike (22 cau hinh loi, 12 chuong trinh moi loi) va test co huong
        run: |
          python3 cosim/run_random.py --n 12 --seed0 4000 --jobs 2 --spike $HOME/spike/bin/spike
          python3 cosim/run_directed.py --spike $HOME/spike/bin/spike

      - name: So vet voi Spike bang Verilator (cung bo chuong trinh, trace phai khop ban iverilog) va coverage cua pipeline
        run: |
          python3 verilator/run_vlcosim.py cosim /tmp/riscv-tests --spike $HOME/spike/bin/spike --core "RV32IMC + cache 2x2"
          python3 verilator/run_vlcosim.py random --n 4 --seed0 1000 --idx 3 4 --spike $HOME/spike/bin/spike
          python3 verilator/run_plcov.py run --dat /tmp/plcov --cores 3 --riscv-tests /tmp/riscv-tests --spike $HOME/spike/bin/spike
          python3 verilator/run_plcov.py merge --dat /tmp/plcov --report /tmp/plcov/pipeline.txt | tee plcov.txt
      - name: Luu bao cao coverage pipeline
        uses: actions/upload-artifact@v4
        with:
          name: verilator-coverage-pipeline
          path: /tmp/plcov/pipeline.txt

      - name: So vet voi Spike khi co ngat (Spike dang thu vien, irq_storm + bench duoi bao ngat, 2 cau hinh loi)
        run: python3 cosim/irq/run_irq_cosim.py --spike $HOME/spike/bin/spike --quick

  mutation:
    # Mutation 3 loi (so vet voi ISS). Truoc day vuot 60 phut (24/11/2026) roi 120 phut (25/11/2026) vi moi dot bien chay
    # het 21 chuong trinh, chuong trinh treo chay toi gioi han chu ky; nay --mutate dung o chuong trinh lech dau tien
    # (RV32IM: 66 dot bien trong 3 phut tren may 2 nhan).
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        core: ["", "--pipe", "--pipem"]
    steps:
      - uses: actions/checkout@v4
      - name: Cai iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Mutation test (loi ${{ matrix.core || 'single-cycle' }})
        working-directory: verify
        run: python3 run_verify.py ${{ matrix.core }} --mutate

  mutation-ext:
    # Mutation mo rong (can Spike), moi nhom 1 job, muc tieu <= 50 phut moi job (gio do duoc ghi canh tung nhom, lan
    # workflow_dispatch tren nhanh sua-ha-tang 26/11/2026). Them dot bien cho nhom nao thi do lai va tach nhom trong cung commit.
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # do ngay 26/11/2026 (buoc Mutation, may CI): rvc 22 phut, random 1, cache 31-41, bpred 17, tage 4, mul < 1, zb 1,5, soc 4,
        # axi 20, irq-0-14 17-23, irq-28-42 22, irq-42- (PMP, S/U, MMU: 67 dot bien) 10; irq-14-28 mat 39 roi 56 phut
        # (sat gioi han 60) nen tach doi: 14-21 khoang 17-25, 21-28 khoang 22-32. Truoc khi them
        # --stop-on-fail cho dot bien "rand", nhom bpred + mul + zb vuot 60 phut (moi dot bien bpred 8-17 phut).
        group: [rvc, random, cache, bpred, tage, mul, zb, soc, axi, irq-0-14, irq-14-21, irq-21-28, irq-28-42, irq-42-]
    env:
      SPIKE_SHA: 7d1ee24bcc3308557e1c6a45c579db9ca5e97dd9
    steps:
      - uses: actions/checkout@v4

      - name: Cai iverilog, trinh bien dich RISC-V va dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc-riscv64-unknown-elf device-tree-compiler

      - name: Cache Spike
        id: cache-spike
        uses: actions/cache@v4
        with:
          path: ~/spike
          key: spike-${{ env.SPIKE_SHA }}-ubuntu-24.04

      - name: Build Spike
        if: steps.cache-spike.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/spike-src
          cd /tmp/spike-src
          git checkout $SPIKE_SHA
          git submodule update --init --depth 1
          mkdir build && cd build
          ../configure --prefix=$HOME/spike
          make -j$(nproc)
          make install

      - name: Mutation ${{ matrix.group }}
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-tests.git /tmp/riscv-tests
          S=$HOME/spike/bin/spike
          case "${{ matrix.group }}" in
            rvc)    python3 rvc/mutate_rvc.py /tmp/riscv-tests --spike $S ;;
            random) python3 cosim/mutate_random.py --n 80 --spike $S ;;
            cache)  python3 cache/mutate_cache.py /tmp/riscv-tests --spike $S ;;
            bpred)  python3 bpred/mutate_bpred.py ;;
            tage)   python3 tage/mutate_tage.py --spike $S ;;
            mul)    python3 mul/mutate_mul.py ;;
            zb)     python3 zb/mutate_zb.py ;;
            soc)
              sh soc/sw/build.sh
              SU=1 sh soc/sw/build.sh
              python3 soc/mutate_soc.py --jobs 4 ;;
            axi)
              AXI=1 sh soc/sw/build.sh
              python3 soc/mutate_axi.py --jobs 2 ;;
            irq-*)  # mutate_irq_cosim.py (16 dot bien ngat co ban + ngat, bo dem, PMP, S/U, MMU), chia theo --range
              r=${{ matrix.group }}; r=${r#irq-}; r=${r/-/:}
              python3 cosim/irq/mutate_irq_cosim.py --spike $S --range "$r" ;;
          esac
