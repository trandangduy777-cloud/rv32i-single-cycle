# Kiem chung tu dong moi lan push: testbench tu kiem tra, so vet voi ISS tren chuong trinh ngau nhien, ngat,
# so tung lenh voi Spike (job cosim), chung minh hinh thuc bo nhan (job formal),
# bo test ISA chinh thuc riscv-tests va benchmark (so checksum giua cac loi).
# Mutation test chay lau (10-20 phut) nen chi chay khi bam "Run workflow" trong tab Actions.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cai iverilog va trinh bien dich RISC-V
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc-riscv64-unknown-elf

      - name: Testbench tu kiem tra (3 loi)
        run: |
          iverilog -g2012 -DNO_VCD -o sc tb_rv32i_core.v rv32i_core.v
          vvp sc | tee sc.log && grep -q "\[TB\] PASS" sc.log
          iverilog -g2012 -DPIPE -DNO_VCD -o p tb_rv32i_pipeline.v rv32i_pipeline.v
          vvp p +prog=prog_base.hex | tee p.log && grep -q "\[TB\] PASS" p.log
          iverilog -g2012 -DPIPE_FULL -DNO_VCD -o pm tb_rv32i_pipeline.v rv32im_pipeline.v rv32i_core.v
          vvp pm +prog=prog.hex | tee pm.log && grep -q "\[TB\] PASS" pm.log

      - name: So vet tung lenh voi ISS (chuong trinh ngau nhien)
        working-directory: verify
        run: |
          python3 run_verify.py --n 60
          python3 run_verify.py --pipe --n 60
          python3 run_verify.py --pipem --n 60
          python3 run_verify.py --pipem --cache --n 60
          python3 run_verify.py --pipem --cache --ways 2 --n 60
          python3 run_verify.py --pipem --ma --n 60
          python3 run_verify.py --pipem --ma --cache --n 60
          python3 run_verify.py --pipem --bpstress --n 60
          python3 run_verify.py --pipem --bpstress --cache --n 60
          python3 run_verify.py --pipem --mul-lat 0 --n 60
          python3 run_verify.py --pipem --mul-lat 1 --n 60
          python3 run_verify.py --pipem --mul-lat 1 --cache --n 60

      - name: Bo nhan song song (Booth + cay CSA), thu het moi cap o 3-10 bit, gia tri bien + ngau nhien o 33 bit
        run: |
          for w in 3 4 5 8 9 10 33; do
            iverilog -g2012 -DW=$w -o mul.vvp mul/tb_mul.v rv32i_core.v
            vvp -n mul.vvp +n=20000 | tee mul.log && grep -q "\[MUL\] PASS" mul.log
          done

      - name: Ngat timer va ngat ngoai (pipeline RV32IM) va mutation test phan ngat
        run: |
          iverilog -g2012 -o irq.vvp irq/tb_irq.v rv32im_pipeline.v rv32i_core.v rv32_mtimer.v
          vvp irq.vvp | tee irq.log && grep -q "\[IRQ\] PASS" irq.log
          python3 irq/mutate_irq.py

      - name: Bo giai nen lenh C, so ca 49.152 ma lenh 16 bit voi GNU objdump
        run: python3 rvc/check_decompress.py

      - name: Cache lenh/du lieu (1, 2, 4 duong), bo dem ghi va bo phan xu bus, kiem tra ngau nhien (9 cau hinh x 3 seed)
        run: |
          for cfg in "-DL=4 -DW=2" "-DL=16 -DW=4" "-DL=2 -DW=8" "-DL=4 -DW=2 -DQ=1" "-DL=16 -DW=4 -DQ=3" \
                     "-DL=8 -DW=2 -DWY=2" "-DL=16 -DW=4 -DWY=2" "-DL=4 -DW=2 -DWY=4" "-DL=16 -DW=4 -DWY=4 -DQ=1"; do
            iverilog -g2012 $cfg -o cr.vvp cache/tb_cache_random.v rv32_icache.v rv32_dcache.v rv32_bus_arbiter.v
            for seed in 1 2 3; do
              vvp -n cr.vvp +seed=$seed +n=20000 +lat=6 | tee c.log
              grep -q "\[CACHE\] PASS" c.log
            done
          done

      - name: riscv-tests (rv32ui, rv32um)
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-tests.git /tmp/riscv-tests
          python3 riscv-tests/run_riscv_tests.py /tmp/riscv-tests

      - name: SoC (bus, UART, GPIO, timer, chuong trinh C qua UART, so bit UART)
        run: |
          sh soc/sw/build.sh
          python3 soc/run_soc.py

      - name: Benchmark (CPI, so checksum giua cac loi)
        run: sh bench/run_bench.sh

  formal:
    # Chung minh hinh thuc bo nhan song song 33 bit (tach bo de, yosys + z3) kem doi chung am.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cai yosys (YoWASP) va z3
        run: pip install yowasp-yosys==0.71.0.0.post1285 z3-solver==5.4.1.0
      - name: Chung minh bo nhan (L1-L4, dai so, doi chung am)
        run: python3 mul/formal/run_formal.py

  formal-rvfi:
    # riscv-formal (RVFI) cho pipeline RV32IMC: moi check insn_*, reg, pc_fwd/pc_bwd, causal, unique, liveness, hang, CSR, cover
    # bang SymbiYosys + Boolector (BMC), roi dot bien co y: moi dot bien PHAI lam check tuong ung FAIL. Xem formal/README.md muc riscv-formal.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache Boolector, SymbiYosys
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: formal-tools-${{ hashFiles('formal/setup_ci.sh') }}
      - name: Cai yosys (YoWASP), SymbiYosys, Boolector
        run: |
          sh formal/setup_ci.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cac check riscv-formal (tat ca)
        run: JOBS=$(nproc) bash formal/run.sh run '.'
      - name: Dot bien co y (moi loi phai bi bat)
        run: bash formal/mutate.sh
      - name: Luu log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv-formal-logs
          path: |
            /tmp/formal-work/results.txt
            /tmp/formal-work/riscv-formal/cores/rv32im_pipeline/checks/*.log

  cosim:
    # So tung lenh voi Spike. Spike duoc build tu ma nguon (ghim phien ban) va luu cache giua cac lan chay.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SPIKE_SHA: 7d1ee24bcc3308557e1c6a45c579db9ca5e97dd9
    steps:
      - uses: actions/checkout@v4

      - name: Cai iverilog, trinh bien dich RISC-V va dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc-riscv64-unknown-elf device-tree-compiler

      - name: Cache Spike
        id: cache-spike
        uses: actions/cache@v4
        with:
          path: ~/spike
          key: spike-${{ env.SPIKE_SHA }}-ubuntu-24.04

      - name: Build Spike
        if: steps.cache-spike.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/spike-src
          cd /tmp/spike-src
          git checkout $SPIKE_SHA
          git submodule update --init --depth 1
          mkdir build && cd build
          ../configure --prefix=$HOME/spike
          make -j$(nproc)
          make install

      - name: Hieu nang bo du doan nhanh, kiem dung tung chu ky
        run: python3 bpred/perf_bpred.py --check

      - name: CoreMark 1 vong tren pipeline RV32IM / RV32IMC (kiem CRC chuan, in CoreMark/MHz)
        run: python3 coremark/run_coremark.py --iter 1 --quick

      - name: So vet voi Spike (riscv-tests, bench, bench_m, bench_call, CoreMark, test tu viet; 13 cau hinh loi)
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-tests.git /tmp/riscv-tests
          python3 cosim/run_cosim.py /tmp/riscv-tests --spike $HOME/spike/bin/spike

      - name: So vet voi Spike khi co ngat (Spike dang thu vien, irq_storm + bench duoi bao ngat, 2 cau hinh loi)
        run: python3 cosim/irq/run_irq_cosim.py --spike $HOME/spike/bin/spike --quick

      - name: Mutation test mo rong C, cache, du doan nhanh, bo nhan (chi khi bam Run workflow)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 rvc/mutate_rvc.py /tmp/riscv-tests --spike $HOME/spike/bin/spike
          python3 cosim/irq/mutate_irq_cosim.py --spike $HOME/spike/bin/spike
          python3 cache/mutate_cache.py /tmp/riscv-tests --spike $HOME/spike/bin/spike
          python3 bpred/mutate_bpred.py
          python3 mul/mutate_mul.py
          sh soc/sw/build.sh
          python3 soc/mutate_soc.py --jobs 4

  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cai iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Mutation test (3 loi)
        working-directory: verify
        run: |
          python3 run_verify.py --mutate
          python3 run_verify.py --pipe --mutate
          python3 run_verify.py --pipem --mutate
