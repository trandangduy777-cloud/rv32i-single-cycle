# Cau hinh riscv-formal cho pipeline RV32IMC (rv32im_pipeline.v, ENABLE_C = 1, MISALIGNED = 0).
# Chay bang formal/run.sh (dung thu muc lam viec cores/rv32im_pipeline cua riscv-formal).
[options]
isa rv32imc
solver boolector

# Do sau BMC (so chu ky). "insn": lenh phai hoan tat DUNG o chu ky nay; "reg a b": bat dau kiem o chu ky a, sau b chu ky.
[depth]
insn            18
insn_(div|divu|rem|remu)  34
reg       15    25
pc_fwd   3     14
pc_bwd    10    30
liveness  1  5  60
unique    1  10 30
causal    10    30
hang      1     30
csrw            18
csr_ill         18
csrc_any  1     25
csrc_const 1    25
cover     1     20

[sort]
reg_ch0

# CSR hien thuc day du 32 bit ghi duoc (csrw kiem moi bit); mstatus/mie/mtvec chi ghi duoc mot phan nen khong
# di qua kiem tra csrw (kiem tra do gia dinh moi bit ghi duoc); mepc bit 0 luon 0 theo dac ta nen cung khong
# di qua csrw (mepc duoc phu boi cosim/tests/mepc_c.S), xem README
[csrs]
mscratch  any
mcause
mtval
mhartid   const="32'h 0"

# CSR khong co trong lo: truy cap phai gay trap (che do M)
[illegal_csrs]
c00  m  rw
c01  m  rw
c02  m  rw
c80  m  rw
c81  m  rw
c82  m  rw
100  m  rw
105  m  rw
141  m  rw
180  m  rw
302  m  rw
303  m  rw
306  m  rw
30a  m  rw
3a0  m  rw

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RV_FORMAL_MUL_LAT 2

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rv32im_pipeline.v
@basedir@/cores/@core@/rv32i_core.v
@basedir@/cores/@core@/rv32c_decompress.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
