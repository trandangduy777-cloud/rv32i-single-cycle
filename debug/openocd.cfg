# OpenOCD toi rv32_dbg_top qua remote_bitbang (Vdbg --port 9824)
adapter driver remote_bitbang
remote_bitbang host localhost
# cong bitbang lay tu bien moi truong RBB_PORT (mac dinh 9824) de chay song song nhieu phien
if {[info exists ::env(RBB_PORT)]} { remote_bitbang port $::env(RBB_PORT) } else { remote_bitbang port 9824 }
adapter speed 1000
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10002001
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
gdb_report_data_abort enable
riscv set_command_timeout_sec 10
init
